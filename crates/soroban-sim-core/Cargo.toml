[package]
name = "soroban-sim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

description = "Portable Soroban simulation and forked network sessions"

[dependencies]
anyhow.workspace = true
ed25519-dalek.workspace = true
p256.workspace = true
sha2.workspace = true
soroban-env-host = { workspace = true, features = ["recording_mode"], optional = true }
soroban-env-host-apply = { workspace = true, optional = true }
soroban-simulation = { workspace = true, optional = true }
stellar-strkey.workspace = true

soroban-env-host-p27 = { package = "soroban-env-host", version = "=27.0.1", features = ["recording_mode"], optional = true }
soroban-env-host-p30 = { package = "soroban-env-host", version = "=30.0.0", features = ["recording_mode"], optional = true }
soroban-simulation-p27 = { package = "soroban-simulation", version = "=27.0.1", optional = true }
soroban-simulation-p30 = { package = "soroban-simulation", version = "=30.0.0", optional = true }
soroban-env-host-apply-p27 = { package = "soroban-sim-host-p27", path = "../soroban-sim-host-p27", version = "=27.0.1", optional = true }
soroban-env-host-apply-p30 = { package = "soroban-sim-host-p30", path = "../soroban-sim-host-p30", version = "=30.0.0", optional = true }

[features]
default = ["exact-apply", "host-p29"]
# Apply session transactions with a host built without `recording_mode`, so
# CPU metering matches stellar-core exactly (see the workspace manifest).
exact-apply = []
host-p27 = ["dep:soroban-env-host-p27", "dep:soroban-simulation-p27", "dep:soroban-env-host-apply-p27"]
host-p29 = ["dep:soroban-env-host", "dep:soroban-simulation", "dep:soroban-env-host-apply"]
host-p30 = ["dep:soroban-env-host-p30", "dep:soroban-simulation-p30", "dep:soroban-env-host-apply-p30"]

[dev-dependencies]
base64 = "0.22"
hex = "0.4.3"
serde_json = "1"
